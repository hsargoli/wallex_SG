[project]
name = "wallex-backend"
version = "0.1.0"
description = "Wallex Trading Platform — Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # HTTP & WS
    "httpx>=0.27",
    "websockets>=12.0",
    # App
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Utils
    "structlog>=24.1",
    "tenacity>=8.3",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "numpy>=2.4.6",
    "joblib>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil>=2.9",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode character (Persian text)
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
