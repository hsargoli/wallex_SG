name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel duplicate runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallex
          POSTGRES_PASSWORD: wallex_test
          POSTGRES_DB: wallex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://wallex:wallex_test@localhost:5432/wallex_test
      JWT_SECRET_KEY: ci-test-secret-not-for-prod
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: "7"
      BCRYPT_COST: "4"
      REGISTER_IP_LIMIT_HOURS: "24"
      WALLEX_API_KEY: "dummy-wallex-api-key-for-ci"
      WALLEX_TOKEN_ENC_KEY: "vT9R4uB6yH8nM2wS5xZ3cV7bN1lK0jI4pO8tR6eW9qY="
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Alembic upgrade
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -x -q --tb=short

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
